name: Hardhat migration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frozen-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Offline recovery regressions (no RPC or database)
        run: node --test sol/contract_upgrade/test/*.test.js
